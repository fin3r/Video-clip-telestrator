<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Telestrator & Media Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video, img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }

    #imagePlayer {
      display: none;
    }

    canvas {
      position: absolute;
      cursor: crosshair;
      z-index: 10;
    }

    /* Floating UI Elements */
    .hud {
      position: absolute;
      z-index: 30;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
    }

    body.ui-hidden .hud {
      opacity: 0;
      pointer-events: none;
    }

    body.ui-hidden {
      cursor: none;
    }

    /* Minimalist Translucent Playlist Dock */
    #playlistDock {
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      scrollbar-width: none;
    }

    #playlistDock::-webkit-scrollbar {
      display: none;
    }

    .glass-btn {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .add-btn {
      width: 40px;
      height: 40px;
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
    }

    #fileInput {
      display: none;
    }

    .clip-btn {
      width: 34px;
      height: 34px;
      font-size: 13px;
      font-weight: 500;
    }

    .clip-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* Bottom Control Bar */
    #bottomHud {
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 92%;
      max-width: 980px;
    }

    .scrub-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    #scrubBar {
      flex: 1;
      accent-color: #ffffff;
      cursor: pointer;
      height: 3px;
    }

    #timeDisplay {
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", monospace;
      color: rgba(255, 255, 255, 0.6);
      min-width: 80px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .controls-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 40px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: 600;
    }

    .pill-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    /* Record Button Monochromatic Pulse */
    #btnRecord.recording {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-weight: 600;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* The only colored element on screen */
    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
      overflow: hidden;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }

    input[type="range"]#lineWidth {
      width: 50px;
      accent-color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="videoPlayer" playsinline></video>
    <img id="imagePlayer" alt="Static Media">
    <canvas id="canvasOverlay"></canvas>
  </div>

  <!-- Minimal Playlist Dock -->
  <div id="playlistDock" class="hud">
    <label class="glass-btn add-btn" for="fileInput" title="Add Media">+</label>
    <input type="file" id="fileInput" accept="video/*,image/*" multiple>
    <div id="clipList" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <!-- Floating HUD -->
  <div id="bottomHud" class="hud">
    <div class="scrub-container">
      <input type="range" id="scrubBar" value="0" min="0" step="0.01">
      <span id="timeDisplay">0:00 / 0:00</span>
    </div>

    <div class="controls-pill">
      <button class="pill-btn" id="btnRewind" title="Rewind 5s">-5s</button>
      <button class="pill-btn" id="btnPlayPause">Play</button>
      <button class="pill-btn" id="btnForward" title="Forward 5s">+5s</button>

      <div class="divider"></div>

      <!-- Lone color swatch -->
      <input type="color" id="colorPicker" value="#ff0000" title="Pen Color">
      <input type="range" id="lineWidth" min="3" max="24" value="14" title="Line Width">

      <div class="divider"></div>

      <button class="pill-btn active" id="btnToolDraw">Pen</button>
      <button class="pill-btn" id="btnToolArrow">Arrow</button>
      <button class="pill-btn" id="btnToolCircle">Circle</button>
      <button class="pill-btn" id="btnToolZone" title="Click 4 points to define a zone">Zone</button>

      <div class="divider"></div>

      <button class="pill-btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="pill-btn" id="btnClear">Clear</button>

      <div class="divider"></div>

      <button class="pill-btn" id="btnRecord" title="Record Screen/Tab as H.264">Rec</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const clipList = document.getElementById('clipList');
    const video = document.getElementById('videoPlayer');
    const imagePlayer = document.getElementById('imagePlayer');
    const canvas = document.getElementById('canvasOverlay');
    const ctx = canvas.getContext('2d');

    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnRewind = document.getElementById('btnRewind');
    const btnForward = document.getElementById('btnForward');
    const scrubBar = document.getElementById('scrubBar');
    const timeDisplay = document.getElementById('timeDisplay');

    const colorPicker = document.getElementById('colorPicker');
    const lineWidthInput = document.getElementById('lineWidth');
    const btnToolDraw = document.getElementById('btnToolDraw');
    const btnToolArrow = document.getElementById('btnToolArrow');
    const btnToolCircle = document.getElementById('btnToolCircle');
    const btnToolZone = document.getElementById('btnToolZone');
    const btnUndo = document.getElementById('btnUndo');
    const btnClear = document.getElementById('btnClear');
    const btnRecord = document.getElementById('btnRecord');

    let mediaQueue = [];
    let currentMedia = null;
    let activeTool = 'draw';
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let snapshot = null;

    // Undo Stack
    let undoStack = [];
    const MAX_UNDO = 30;

    // 4-Point Zone
    let zonePoints = [];
    let zoneSnapshot = null;

    // Screen Recording State
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordStream = null;

    // --- Inactivity UI Auto-Hide (5 Seconds) ---
    let hideTimeout;

    function resetUiTimeout() {
      document.body.classList.remove('ui-hidden');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        if (!isDrawing && zonePoints.length === 0) {
          document.body.classList.add('ui-hidden');
        }
      }, 5000);
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetUiTimeout);
    });
    resetUiTimeout();

    // --- Precise Canvas Alignment ---
    function matchCanvasToMedia() {
      const activeElement = (currentMedia && currentMedia.type === 'image') ? imagePlayer : video;
      const rect = activeElement.getBoundingClientRect();
      const stageRect = document.getElementById('stage').getBoundingClientRect();

      canvas.style.top = (rect.top - stageRect.top) + 'px';
      canvas.style.left = (rect.left - stageRect.left) + 'px';
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const prevCanvas = document.createElement('canvas');
      prevCanvas.width = canvas.width;
      prevCanvas.height = canvas.height;
      const prevCtx = prevCanvas.getContext('2d');
      if (canvas.width > 0 && canvas.height > 0) {
        prevCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      if (prevCanvas.width > 0 && prevCanvas.height > 0) {
        ctx.drawImage(prevCanvas, 0, 0, canvas.width, canvas.height);
      }
    }

    window.addEventListener('resize', matchCanvasToMedia);
    video.addEventListener('loadedmetadata', matchCanvasToMedia);
    imagePlayer.addEventListener('load', matchCanvasToMedia);

    // --- Media Queue ---
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach((file) => {
        const isImage = file.type.startsWith('image/');
        const item = {
          name: file.name,
          url: URL.createObjectURL(file),
          type: isImage ? 'image' : 'video'
        };
        mediaQueue.push(item);

        const index = mediaQueue.length;
        const btn = document.createElement('button');
        btn.className = 'glass-btn clip-btn';
        btn.textContent = index;
        btn.title = `${item.name} (${item.type})`;
        btn.addEventListener('click', () => playMedia(item, btn));
        clipList.appendChild(btn);
      });

      if (!currentMedia && mediaQueue.length > 0) {
        playMedia(mediaQueue[0], clipList.children[0]);
      }
    });

    function playMedia(item, btnElement) {
      document.querySelectorAll('.clip-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      currentMedia = item;
      clearCanvas();

      if (item.type === 'image') {
        video.pause();
        video.style.display = 'none';
        imagePlayer.style.display = 'block';
        imagePlayer.src = item.url;

        btnPlayPause.disabled = true;
        btnRewind.disabled = true;
        btnForward.disabled = true;
        scrubBar.disabled = true;
        btnPlayPause.textContent = 'Image';
        timeDisplay.textContent = 'STATIC';
      } else {
        imagePlayer.style.display = 'none';
        video.style.display = 'block';
        video.src = item.url;

        btnPlayPause.disabled = false;
        btnRewind.disabled = false;
        btnForward.disabled = false;
        scrubBar.disabled = false;

        video.play().then(() => {
          btnPlayPause.textContent = 'Pause';
        }).catch(() => {
          btnPlayPause.textContent = 'Play';
        });
      }
    }

    // --- Playback Controls ---
    btnPlayPause.addEventListener('click', () => {
      if (!currentMedia || currentMedia.type === 'image') return;
      if (video.paused || video.ended) {
        video.play();
        btnPlayPause.textContent = 'Pause';
      } else {
        video.pause();
        btnPlayPause.textContent = 'Play';
      }
    });

    btnRewind.addEventListener('click', () => {
      if (!currentMedia || currentMedia.type === 'image') return;
      video.currentTime = Math.max(0, video.currentTime - 5);
    });

    btnForward.addEventListener('click', () => {
      if (!currentMedia || currentMedia.type === 'image') return;
      video.currentTime = Math.min(video.duration, video.currentTime + 5);
    });

    video.addEventListener('timeupdate', () => {
      if (!video.duration || (currentMedia && currentMedia.type === 'image')) return;
      scrubBar.value = (video.currentTime / video.duration) * 100;

      const curMins = Math.floor(video.currentTime / 60);
      const curSecs = Math.floor(video.currentTime % 60).toString().padStart(2, '0');
      const durMins = Math.floor(video.duration / 60) || 0;
      const durSecs = Math.floor(video.duration % 60).toString().padStart(2, '0') || '00';
      timeDisplay.textContent = `${curMins}:${curSecs} / ${durMins}:${durSecs}`;
    });

    scrubBar.addEventListener('input', () => {
      if (video.duration && currentMedia && currentMedia.type === 'video') {
        video.currentTime = (scrubBar.value / 100) * video.duration;
      }
    });

    // --- Tool Switching ---
    function cancelZone() {
      if (zoneSnapshot) {
        ctx.putImageData(zoneSnapshot, 0, 0);
      }
      zonePoints = [];
      zoneSnapshot = null;
    }

    function setActiveTool(tool) {
      if (zonePoints.length > 0) {
        cancelZone();
      }
      activeTool = tool;
      btnToolDraw.classList.toggle('active', tool === 'draw');
      btnToolArrow.classList.toggle('active', tool === 'arrow');
      btnToolCircle.classList.toggle('active', tool === 'circle');
      btnToolZone.classList.toggle('active', tool === 'zone');
    }

    btnToolDraw.addEventListener('click', () => setActiveTool('draw'));
    btnToolArrow.addEventListener('click', () => setActiveTool('arrow'));
    btnToolCircle.addEventListener('click', () => setActiveTool('circle'));
    btnToolZone.addEventListener('click', () => setActiveTool('zone'));

    // --- Undo Management ---
    function pushUndoState() {
      if (canvas.width === 0 || canvas.height === 0) return;
      const currentState = ctx.getImageData(0, 0, canvas.width, canvas.height);
      undoStack.push(currentState);
      if (undoStack.length > MAX_UNDO) {
        undoStack.shift();
      }
    }

    function undoLast() {
      if (zonePoints.length > 0) {
        cancelZone();
        return;
      }
      if (undoStack.length > 0) {
        const lastState = undoStack.pop();
        ctx.putImageData(lastState, 0, 0);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      resetUiTimeout();
    }

    btnUndo.addEventListener('click', undoLast);
    btnClear.addEventListener('click', clearCanvas);

    function clearCanvas() {
      if (canvas.width > 0 && canvas.height > 0) {
        pushUndoState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      zonePoints = [];
      zoneSnapshot = null;
    }

    function hexToRgba25(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, 0.25)`;
    }

    // --- Sharp Arrow ---
    function drawArrow(fromX, fromY, toX, toY, color, width) {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const dist = Math.hypot(toX - fromX, toY - fromY);
      if (dist < 4) return;

      const headLength = Math.max(22, width * 2.8);
      const headWidth = Math.max(20, width * 2.5);
      const actualHeadLen = Math.min(headLength, dist);

      const shaftEndX = toX - (actualHeadLen * 0.7) * Math.cos(angle);
      const shaftEndY = toY - (actualHeadLen * 0.7) * Math.sin(angle);

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(shaftEndX, shaftEndY);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.stroke();

      const leftX = toX - actualHeadLen * Math.cos(angle) + (headWidth / 2) * Math.sin(angle);
      const leftY = toY - actualHeadLen * Math.sin(angle) - (headWidth / 2) * Math.cos(angle);
      const rightX = toX - actualHeadLen * Math.cos(angle) - (headWidth / 2) * Math.sin(angle);
      const rightY = toY - actualHeadLen * Math.sin(angle) + (headWidth / 2) * Math.cos(angle);

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(leftX, leftY);
      ctx.lineTo(rightX, rightY);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawCircle(centerX, centerY, radius, color, width) {
      ctx.beginPath();
      ctx.arc(centerX, centerY, Math.abs(radius), 0, 2 * Math.PI);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function completeZone() {
      if (zoneSnapshot) ctx.putImageData(zoneSnapshot, 0, 0);

      ctx.beginPath();
      ctx.moveTo(zonePoints[0].x, zonePoints[0].y);
      for (let i = 1; i < zonePoints.length; i++) {
        ctx.lineTo(zonePoints[i].x, zonePoints[i].y);
      }
      ctx.closePath();

      ctx.fillStyle = hexToRgba25(colorPicker.value);
      ctx.fill();

      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lineWidthInput.value;
      ctx.lineJoin = 'round';
      ctx.stroke();

      zonePoints = [];
      zoneSnapshot = null;
      resetUiTimeout();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    // --- Drawing Events ---
    canvas.addEventListener('mousedown', (e) => {
      if (currentMedia && currentMedia.type === 'video' && !video.paused) {
        video.pause();
        btnPlayPause.textContent = 'Play';
      }

      const coords = getCoords(e);

      if (activeTool === 'zone') {
        if (zonePoints.length === 0) {
          pushUndoState();
          zoneSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }
        zonePoints.push(coords);

        if (zonePoints.length === 4) {
          completeZone();
        }
        return;
      }

      pushUndoState();

      isDrawing = true;
      startX = coords.x;
      startY = coords.y;

      if (activeTool === 'arrow' || activeTool === 'circle') {
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      } else {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const coords = getCoords(e);

      if (activeTool === 'zone' && zonePoints.length > 0 && zonePoints.length < 4 && zoneSnapshot) {
        ctx.putImageData(zoneSnapshot, 0, 0);

        ctx.beginPath();
        ctx.moveTo(zonePoints[0].x, zonePoints[0].y);
        for (let i = 1; i < zonePoints.length; i++) {
          ctx.lineTo(zonePoints[i].x, zonePoints[i].y);
        }
        ctx.lineTo(coords.x, coords.y);
        ctx.closePath();

        ctx.fillStyle = hexToRgba25(colorPicker.value);
        ctx.fill();

        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthInput.value;
        ctx.lineJoin = 'round';
        ctx.stroke();
        return;
      }

      if (!isDrawing) return;

      if (activeTool === 'draw') {
        ctx.lineTo(coords.x, coords.y);
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthInput.value;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      } else if (activeTool === 'arrow') {
        ctx.putImageData(snapshot, 0, 0);
        drawArrow(startX, startY, coords.x, coords.y, colorPicker.value, lineWidthInput.value);
      } else if (activeTool === 'circle') {
        ctx.putImageData(snapshot, 0, 0);
        const radius = Math.hypot(coords.x - startX, coords.y - startY);
        drawCircle(startX, startY, radius, colorPicker.value, lineWidthInput.value);
      }
    });

    window.addEventListener('mouseup', () => {
      if (activeTool !== 'zone' && isDrawing) {
        isDrawing = false;
        resetUiTimeout();
      }
    });

    // --- Recording Engine ---
    function getSupportedMimeType() {
      const candidates = [
        { mime: 'video/mp4;codecs=avc1', ext: 'mp4' },
        { mime: 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', ext: 'mp4' },
        { mime: 'video/mp4', ext: 'mp4' },
        { mime: 'video/webm;codecs=h264', ext: 'webm' },
        { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
        { mime: 'video/webm', ext: 'webm' }
      ];
      for (const candidate of candidates) {
        if (MediaRecorder.isTypeSupported(candidate.mime)) {
          return candidate;
        }
      }
      return { mime: '', ext: 'webm' };
    }

    async function startRecording() {
      try {
        recordStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            displaySurface: 'browser',
            frameRate: { ideal: 60, max: 60 }
          },
          audio: true,
          preferCurrentTab: true
        });

        const selectedFormat = getSupportedMimeType();
        const options = selectedFormat.mime ? { mimeType: selectedFormat.mime, videoBitsPerSecond: 6000000 } : {};

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(recordStream, options);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: selectedFormat.mime || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const timestamp = new Date().toISOString().slice(11, 19).replace(/:/g, '-');
          a.href = url;
          a.download = `telestrator-rec-${timestamp}.${selectedFormat.ext}`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);

          btnRecord.classList.remove('recording');
          btnRecord.textContent = 'Rec';
        };

        recordStream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        };

        mediaRecorder.start(1000);
        btnRecord.classList.add('recording');
        btnRecord.textContent = 'Stop Rec';

      } catch (err) {
        console.warn('Recording cancelled or not supported:', err);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      if (recordStream) {
        recordStream.getTracks().forEach(track => track.stop());
      }
    }

    btnRecord.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undoLast();
      } else if (e.code === 'Space') {
        e.preventDefault();
        btnPlayPause.click();
      } else if (e.code === 'Escape') {
        if (activeTool === 'zone' && zonePoints.length > 0) {
          cancelZone();
        }
      } else if (e.key.toLowerCase() === 'c') {
        clearCanvas();
      }
    });
  </script>
</body>
</html>
